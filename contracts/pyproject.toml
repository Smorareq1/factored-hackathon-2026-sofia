[project]
name = "sofia-contracts"
version = "0.1.0"
description = "Contratos entre módulos (§9 del brief): modelos Pydantic + JSON Schema exportado. Dueños: TODOS."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_contracts"]

[project]
name = "sofia-eval"
version = "0.1.0"
description = "Simulador de clientes + harness baseline vs propuesto + métricas MET-01..MET-06. Dueños: SIM (runner, simulador) + DS (métricas, reporte)."
requires-python = ">=3.12"
dependencies = [
    "sofia-contracts",
    "sofia-agent", # el harness corre el grafo en proceso: run_conversation()
    "httpx>=0.27",
    "polars>=1.9",
    "langfuse>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_eval"]

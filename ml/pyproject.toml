[project]
name = "sofia-ml"
version = "0.1.0"
description = "Intent + language router (§8.6, §9.3): training, evaluation vs baseline and HTTP service. Owner: DS."
requires-python = ">=3.12"
dependencies = [
    "sofia-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "polars>=1.9",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_ml"]

# The router trains at startup from the corpus, so it ships inside the package (Cloud Run has no repo checkout).
[tool.hatch.build.targets.sdist.force-include]
"data/intent_corpus.jsonl" = "data/intent_corpus.jsonl"

[tool.hatch.build.targets.wheel.force-include]
"data/intent_corpus.jsonl" = "sofia_ml/data/intent_corpus.jsonl"

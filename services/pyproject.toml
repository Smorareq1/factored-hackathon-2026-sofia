[project]
name = "sofia-services"
version = "0.1.0"
description = "API bancaria simulada: sesión + OTP, permisos, motor de política POL-1..POL-7, auditoría (§9.2). Dueño: SIM."
requires-python = ">=3.12"
dependencies = [
    "sofia-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_services"]

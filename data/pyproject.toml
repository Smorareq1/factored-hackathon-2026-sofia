[project]
name = "sofia-data"
version = "0.1.0"
description = "Pipeline S3 → bronze → silver → gold con contratos, calidad, lineage y freshness (REQ-12). Dueño: OPS."
requires-python = ">=3.12"
dependencies = [
    "sofia-contracts",
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_data"]

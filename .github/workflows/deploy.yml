# CD de S.O.F.I.A.: cada push a develop (merge de PR) reconstruye las imágenes y re-despliega los 4 servicios
# de Cloud Run con `deploy.sh release`. Autenticación por Workload Identity Federation, sin llaves JSON (CON-03);
# el pool solo acepta tokens de este repo en refs/heads/develop (infra/cloudrun/setup-github-deploy.sh).
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Un deploy a la vez; si llegan dos merges seguidos, el segundo espera en lugar de cancelar uno a medias.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Run · deploy.sh release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          # No son secretos: identifican el provider y la cuenta, el acceso lo da el token OIDC de GitHub.
          workload_identity_provider: projects/513456521750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: sofia-deployer@sofia-factored-hackathon.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: infra/cloudrun/deploy.sh release

      - name: URLs
        if: success()
        run: |
          {
            echo "### Cloud Run ($(git rev-parse --short HEAD))"
            for s in frontend agent router bank-api; do
              echo "- **$s**: $(gcloud run services describe "$s" --project sofia-factored-hackathon \
                --region us-central1 --format 'value(status.url)')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

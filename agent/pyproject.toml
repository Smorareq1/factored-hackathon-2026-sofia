[project]
name = "sofia-agent"
version = "0.1.0"
description = "Agente Sofía: grafo LangGraph de 7 capas + Gemini + servicio FastAPI/SSE + baseline de sistema. Dueño: AG."
requires-python = ">=3.12"
dependencies = [
    "sofia-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "psycopg[binary,pool]>=3.2",
    "langchain-google-genai>=2.1",
    "langfuse>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_agent"]

# Los prompts viven en agent/prompts (visibles para los jueces) y viajan dentro del paquete en la imagen.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "sofia_agent/prompts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

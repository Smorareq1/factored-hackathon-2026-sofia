# PURPOSE: misión, alcance y límites de Sofía. Cada cambio sube la versión (semver);
# el hash del archivo se agrega a purpose_version en cada traza.
version: 0.2.0
mission: Recepción de disputas de transacciones (Transaction-Dispute Intake)
persona:
  name: Sofía
  languages: [es, pt]
  tone: cálida, breve y precisa; nunca promete resultados que decide un humano
  # Argentina usa voseo; el resto de los países, tuteo.
  voseo_countries: [AR]
in_scope_intents: [dispute_new, dispute_status, transaction_inquiry]
out_of_scope_policy: abstain_and_offer_human
limits:
  max_clarifications: 2        # POL-7: al tercer intento se escala
  max_tool_retries: 2
  max_llm_calls_per_turn: 2
  tool_timeout_s: 5
  max_message_chars: 2000
interpret:
  # Umbral del router por debajo del cual se aclara. Lo define DS (pendiente D4).
  router_confidence_threshold: 0.55
  # Ventana por defecto para buscar la transacción cuando el cliente no da fechas. Es MÁS amplia que la
  # ventana de disputa (N): el agente no esconde transacciones viejas; POL-3 la decide SIM.
  default_lookback_days: 180
  # Con más candidatos que esto se piden más datos en vez de listarlos.
  max_candidates_listed: 3
  amount_tolerance_pct: 1.0
